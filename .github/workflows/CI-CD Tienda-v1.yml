name: CI/CD Tienda Microservices

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:


# ============================================================
# VARIABLES GLOBALES
# ============================================================

env:
  JAVA_VERSION: '17'


# ============================================================
# PERMISOS
# ============================================================

permissions:
  contents: read


# ============================================================
# JOBS
# ============================================================

jobs:

  # ==========================================================
  # JOB 1 - CI
  # Compilar, levantar BD y ejecutar pruebas
  # ==========================================================

  build-and-test:

    name: CI - Compilar y Probar
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Descargar código
      # ------------------------------------------------------

      - name: Descargar código
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Configurar Java 17
      # ------------------------------------------------------

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven


      # ------------------------------------------------------
      # Dar permisos a Maven Wrapper
      # ------------------------------------------------------

      - name: Dar permisos a Maven Wrapper
        run: |
          chmod +x producto_services/mvnw
          chmod +x inventario_services/mvnw
          chmod +x venta_services/mvnw


      # ======================================================
      # LEVANTAR BASES DE DATOS PARA LOS TESTS
      # ======================================================

      - name: Levantar PostgreSQL para CI
        run: |
          docker run -d \
            --name producto-db \
            -e POSTGRES_DB=producto_db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=123456 \
            -p 5432:5432 \
            postgres:17

          docker run -d \
            --name inventario-db \
            -e POSTGRES_DB=inventario_db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=123456 \
            -p 5433:5432 \
            postgres:17

          docker run -d \
            --name venta-db \
            -e POSTGRES_DB=venta_db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=123456 \
            -p 5434:5432 \
            postgres:17


      # ------------------------------------------------------
      # Esperar a que PostgreSQL este disponible
      # ------------------------------------------------------

      - name: Esperar PostgreSQL
        run: |
          echo "Esperando PostgreSQL..."

          for i in {1..30}; do

            if docker exec producto-db pg_isready \
              -U postgres \
              -d producto_db; then
              echo "Producto DB lista"
              break
            fi

            sleep 2
          done


          for i in {1..30}; do

            if docker exec inventario-db pg_isready \
              -U postgres \
              -d inventario_db; then
              echo "Inventario DB lista"
              break
            fi

            sleep 2
          done


          for i in {1..30}; do

            if docker exec venta-db pg_isready \
              -U postgres \
              -d venta_db; then
              echo "Venta DB lista"
              break
            fi

            sleep 2
          done


      # ======================================================
      # PRODUCTO
      # ======================================================

      - name: Compilar y probar - Producto
        working-directory: ./producto_services
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/producto_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 123456
        run: ./mvnw clean package -DskipTests=false


      # ======================================================
      # INVENTARIO
      # ======================================================

      - name: Compilar y probar - Inventario
        working-directory: ./inventario_services
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/inventario_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 123456
        run: ./mvnw clean package -DskipTests=false


      # ======================================================
      # VENTA
      # ======================================================

      - name: Compilar y probar - Venta
        working-directory: ./venta_services
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/venta_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: 123456
        run: ./mvnw clean package -DskipTests=false


      # ======================================================
      # GUARDAR JARs
      # ======================================================

      - name: Guardar JARs generados
        uses: actions/upload-artifact@v4
        with:
          name: microservices-jars
          path: |
            producto_services/target/*.jar
            inventario_services/target/*.jar
            venta_services/target/*.jar
          retention-days: 1


  # ==========================================================
  # JOB 2 - CD
  # Construir imágenes Docker y publicarlas en Docker Hub
  # ==========================================================

  build-push-images:

    name: CD - Docker Build & Push

    needs: build-and-test

    runs-on: ubuntu-latest

    # Push a master o ejecución manual
    if: |
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'

    steps:

      # ------------------------------------------------------
      # Descargar código
      # ------------------------------------------------------

      - name: Descargar código
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Descargar JARs generados en CI
      # ------------------------------------------------------

      - name: Descargar JARs
        uses: actions/download-artifact@v4
        with:
          name: microservices-jars


      # ------------------------------------------------------
      # Configurar Docker Buildx
      # ------------------------------------------------------

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------------
      # Login en Docker Hub
      # ------------------------------------------------------

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ======================================================
      # PRODUCTO
      # ======================================================

      - name: Construir y publicar - Producto
        uses: docker/build-push-action@v6
        with:
          context: ./producto_services
          file: ./producto_services/Dockerfile
          push: true

          tags: |
            roberthz/producto-service:${{ github.sha }}
            roberthz/producto-service:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ======================================================
      # INVENTARIO
      # ======================================================

      - name: Construir y publicar - Inventario
        uses: docker/build-push-action@v6
        with:
          context: ./inventario_services
          file: ./inventario_services/Dockerfile
          push: true

          tags: |
            roberthz/inventario-service:${{ github.sha }}
            roberthz/inventario-service:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ======================================================
      # VENTA
      # ======================================================

      - name: Construir y publicar - Venta
        uses: docker/build-push-action@v6
        with:
          context: ./venta_services
          file: ./venta_services/Dockerfile
          push: true

          tags: |
            roberthz/venta-service:${{ github.sha }}
            roberthz/venta-service:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================================
  # JOB 3 - DEPLOY
  # Desplegar nuevas imagenes en el servidor VMware
  # mediante Self-hosted Runner
  # ==========================================================

  deploy:

    name: Deploy - Docker Compose
    needs: build-push-images

    # --------------------------------------------------------
    # El job se ejecuta directamente en robert-server
    # --------------------------------------------------------

    runs-on: self-hosted

    # Ejecutar unicamente:
    # - Push a master
    # - Ejecucion manual

    if: |
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'

    steps:

      # ------------------------------------------------------
      # Descargar codigo en el Self-hosted Runner
      # ------------------------------------------------------

      - name: Descargar codigo
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Verificar servidor
      # ------------------------------------------------------

      - name: Verificar servidor
        run: |
          echo "=========================================="
          echo "SERVIDOR DE DESPLIEGUE"
          echo "=========================================="

          echo "Hostname:"
          hostname

          echo "Usuario:"
          whoami

          echo "Directorio:"
          pwd

          echo ""
          echo "=========================================="
          echo "DOCKER"
          echo "=========================================="

          docker --version
          docker compose version


      # ------------------------------------------------------
      # Login en Docker Hub
      # ------------------------------------------------------

      - name: Login en Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin


      # ======================================================
      # DESPLIEGUE
      # ======================================================

      - name: Desplegar con Docker Compose
        run: |

          echo "=========================================="
          echo "INICIANDO DEPLOYMENT"
          echo "=========================================="

          echo "Directorio de trabajo:"
          pwd

          echo ""
          echo "Archivos del proyecto:"
          ls -la


          # --------------------------------------------------
          # Descargar nuevas imagenes
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "DESCARGANDO NUEVAS IMAGENES"
          echo "=========================================="

          docker compose pull


          # --------------------------------------------------
          # Actualizar servicios
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "ACTUALIZANDO SERVICIOS"
          echo "=========================================="

          docker compose up -d --remove-orphans


          # --------------------------------------------------
          # Esperar inicio de servicios
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "ESPERANDO INICIO DE SERVICIOS"
          echo "=========================================="

          sleep 15


          # --------------------------------------------------
          # Mostrar estado
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "ESTADO DE LOS CONTENEDORES"
          echo "=========================================="

          docker compose ps


          # --------------------------------------------------
          # Mostrar logs recientes
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "LOGS RECIENTES"
          echo "=========================================="

          docker compose logs --tail=30


          # --------------------------------------------------
          # Limpiar imagenes antiguas
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "LIMPIANDO IMAGENES ANTIGUAS"
          echo "=========================================="

          docker image prune -af --filter "until=168h"


          # --------------------------------------------------
          # Finalizacion
          # --------------------------------------------------

          echo ""
          echo "=========================================="
          echo "DEPLOYMENT FINALIZADO"
          echo "=========================================="