spring.application.name=inventario_services
server.port=8081

# Base de datos    --- SPRING_PROFILES_ACTIVE=docker 
spring.datasource.url=jdbc:postgresql://inventario-db:5432/inventario_db
spring.datasource.username=postgres
spring.datasource.password=123456

producto.service.url=http://producto-service:8080

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.error.include-message=always
server.error.include-binding-errors=always