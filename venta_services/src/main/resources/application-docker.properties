spring.application.name=venta_services

# Puerto del microservicio
server.port=8082

# ===============================
# Base de Datos PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://venta-db:5432/venta_db
spring.datasource.username=postgres
spring.datasource.password=123456

producto.service.url=http://producto-service:8080
inventario.service.url=http://inventario-service:8081

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Opcional: mostrar errores en las respuestas
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always